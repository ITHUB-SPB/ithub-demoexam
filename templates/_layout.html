<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="/static/vendor/pico.css">
    <link rel="stylesheet" href="/static/vendor/glide.core.css">
    <link rel="stylesheet" href="/static/global.css">
</head>

<body>
    <div class="page">
        <header class="header">
            <img class="logo" src="/static/images/branding/image02.jpg" alt="логотип">
            {% block nav %}{% endblock %}
        </header>
        <div class="glide">
            <div class="glide__track" data-glide-el="track">
                <ul class="glide__slides">
                    <li class="glide__slide">
                        <img src="/static/images/slider/image06.jpg" alt="">
                    </li>
                    <li class="glide__slide">
                        <img src="/static/images/slider/image07.jpg" alt="">
                    </li>
                    <li class="glide__slide">
                        <img src="/static/images/slider/image08.webp" alt="">
                    </li>
                    <li class="glide__slide">
                        <img src="/static/images/slider/image09.webp" alt="">
                    </li>
                    <li class="glide__slide">
                        <img src="/static/images/slider/image10.webp" alt="">
                    </li>
                </ul>
            </div>
        </div>
        {% block content %}
        {% endblock %}
    </div>
    <script src="/static/vendor/glide.js"></script>
    <script>
        new Glide('.glide', { autoplay: 3000 }).mount()
    </script>
</body>

</html>
