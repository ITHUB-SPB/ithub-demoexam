{% extends './_layout.html' %}

{% block title %}Мои заявки{% endblock %}

{% block content %}
<header>
    <a href="/logout">Выйти</a>
    <a href="/create">Создать заявку</a>
</header>
<main>
    <table>
        <thead>
            <tr>
                <th>Курс</th>
                <th>Оплата</th>
                <th>Дата</th>
            </tr>
        </thead>
        <tbody>
            {% for item in records %}
            <tr>
                <td>{{ item["course"] }}</td>
                <td>{{ item["payment"] }}</td>
                <td>{{ item["date"] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</main>    
{% endblock %}
