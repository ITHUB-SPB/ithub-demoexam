{% extends '_layout.html' %}
{% block content %}

<form action="/login" method="post" novalidate>
    <input type="text" name="login" placeholder="Логин" pattern="[a-zA-Z0-9]{6,}" required>
    <p>Латиница и цифры, не менее 6 символов</p>

    <input type="password" name="password" placeholder="Пароль">
    <p>Минимум 8 символов</p>
    <button type="submit">Отправить</button>
</form>
<a href="/register">Уще не зарегистрированны? Регистрация</a>
{% endblock %}
